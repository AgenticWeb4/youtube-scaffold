name: Chrome extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.10.0
      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match package.json version: v$version"
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and package
        run: pnpm run package
      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: |
            dist/youtube-scaffold-v${{ steps.version.outputs.version }}.zip
            dist/youtube-scaffold-v${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish installable ZIP
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download tested package
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name chrome-extension --dir package
      - name: Verify package checksum
        working-directory: package
        run: sha256sum --check "youtube-scaffold-v$VERSION.zip.sha256"
      - name: Publish release
        working-directory: package
        shell: bash
        run: |
          zip="youtube-scaffold-v$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "YouTube Scaffold $GITHUB_REF_NAME" \
              --notes '下载 ZIP 后解压，在 Chrome 扩展管理页开启开发者模式，选择“加载已解压的扩展程序”，打开包含 manifest.json 的目录。API Key 在扩展设置中填写。安装包附带 SHA-256 校验文件。'
          fi
